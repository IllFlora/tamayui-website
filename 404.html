<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>ページが見つかりません | たま結 Tamayui</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 8vh 6vw;
        box-sizing: border-box;
        background: #f6f3ee;
        color: #3a352e;
        font-family: "Noto Serif JP", "Yu Mincho", "Hiragino Mincho ProN", serif;
        line-height: 1.9;
      }
      main {
        max-width: 34rem;
        text-align: center;
      }
      .mark {
        font-size: 0.75rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #9a8f7d;
        margin: 0 0 1.6rem;
      }
      h1 {
        font-size: clamp(1.35rem, 4vw, 1.9rem);
        font-weight: 400;
        margin: 0 0 1.2rem;
      }
      p {
        margin: 0 0 2.4rem;
        font-size: 0.98rem;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.9rem;
        justify-content: center;
      }
      nav a {
        display: inline-block;
        padding: 0.85rem 1.5rem;
        border: 1px solid #cfc4b2;
        border-radius: 999px;
        color: inherit;
        text-decoration: none;
        font-size: 0.92rem;
        transition: background-color 200ms ease, border-color 200ms ease;
      }
      nav a:hover,
      nav a:focus-visible {
        background: #efe9df;
        border-color: #a7997f;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="mark">404 / Page not found</p>
      <h1>お探しのページが見つかりませんでした</h1>
      <p>
        アドレスが変わったか、削除された可能性があります。<br />
        下のリンクから、作品や教室のページへお進みください。
      </p>
      <nav aria-label="主要ページ">
        <a href="/">たま結のホーム</a>
        <a href="/works">作品集</a>
        <a href="/lessons">教室の様子</a>
      </nav>
    </main>
  </body>
</html>
